services:
  ollama:
    image: ollama/ollama:latest
    container_name: document-search-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  ollama-models:

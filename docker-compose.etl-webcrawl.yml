services:
  etl-webcrawl:
    build:
      context: .
      dockerfile: services/etl-webcrawl/Dockerfile
    container_name: document-search-etl-webcrawl
    restart: unless-stopped
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-appdb}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 * * * *}
      TRANSFORMERS_CACHE: /home/node/.cache/huggingface/hub
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model-cache:/home/node/.cache/huggingface/hub

volumes:
  model-cache:

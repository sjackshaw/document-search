services:
  member-benefits-app:
    build: ./services/member-benefits-app
    container_name: document-search-member-benefits-app
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@${PGHOST:-postgres}:${PGPORT:-5432}/${PGDATABASE:-appdb}
      PORT: 3002
      API_KEY: ${API_KEY:-dev-key-please-change}
      DOCUMENT_DIR: /usr/src/app/generated-docs
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data-output/member-benefits-docs:/usr/src/app/generated-docs
